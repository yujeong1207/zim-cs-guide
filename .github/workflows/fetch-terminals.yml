name: 터미널 스케줄 자동 수집 (매일 아침 9:10)

on:
  # ⚠️⚠️⚠️ 2026-08-27 자동 실행을 일부러 꺼뒀어요 ⚠️⚠️⚠️
  # BPT/HPNT 파싱 컬럼이 실제와 안 맞아서(검증 없이 추측으로 넣은 인덱스였음), 항차 코드 같은
  # 엉뚱한 값이 선명 자리에 들어가며 노션 입항 스케줄에 잘못된 데이터가 대량으로 쌓였어요.
  # 정확한 컬럼을 다시 확인하고, 오염된 데이터도 다 정리하기 전까지는 자동 스케줄을 켜면 안 돼요.
  # 아래 schedule을 다시 켜려면, 문제 다 해결한 다음 주석(#) 없애고 원상복구하면 돼요.
  # schedule:
  #   - cron: "10 0 * * *"

  # ⚠️ 2026-08-29 수정: 예전엔 "미리보기" 단계 다음에 바로 "실제 반영" 단계가 자동으로 이어져서,
  # 미리보기가 사실상 의미가 없었어요(어차피 그대로 실제 반영까지 실행됨). 이제 실행할 때마다
  # "미리보기만 할지 / 실제로 반영할지"를 사람이 직접 골라야 하고, 실제 반영은 미리보기 로그를
  # 사람이 보고 확인한 다음 별도로 다시 실행해야만 진행돼요.
  workflow_dispatch:
    inputs:
      apply:
        description: '"preview"면 미리보기만(아무것도 안 바뀜), "apply"면 실제로 Firestore에 반영'
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - apply

jobs:
  fetch-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 필요한 패키지 설치
        run: pip install -r scripts/requirements.txt

      # BCT만 실제 브라우저(Playwright)로 세션 쿠키를 얻어와야 해서, 가상 브라우저(크로미움)를
      # 이 단계에서 미리 설치해둠. --with-deps는 리눅스 환경에서 브라우저 실행에 필요한
      # 시스템 라이브러리까지 같이 설치해줘요 (이게 없으면 브라우저 자체가 안 켜질 수 있어요).
      - name: 가상 브라우저(Playwright) 설치
        run: python -m playwright install --with-deps chromium

      - name: 터미널 5곳에서 데이터 수집
        run: python scripts/fetch_terminals.py
        working-directory: .

      # 스케줄(매일 자동 실행)로 돌 때는 항상 미리보기 없이 바로 반영하는 게 자동화의 목적에
      # 맞으니 preview 모드가 아니게(=apply)로 취급함. 반면 사람이 직접 workflow_dispatch로
      # 실행할 때만 "preview"를 고를 수 있고, 그때는 아래 반영 단계가 실행되지 않아요.
      - name: 미리보기 (실제로는 아무것도 안 바뀜)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.apply == 'preview' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: python scripts/push_to_firestore.py --dry-run

      - name: Firestore에 반영 (이미 raw에 있는 배의 입항일/출항일만 갱신, 신규 추가 절대 안 함)
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.apply == 'apply' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: python scripts/push_to_firestore.py

      # 수집 결과(terminal_data.json)를 매번 로그로 남겨둬서, 실패했을 때 어떤 터미널이
      # 몇 건 가져왔는지/에러 메시지가 뭔지 GitHub 웹사이트에서 바로 다운받아 확인할 수 있게 함
      - name: 수집 결과 저장 (문제 생겼을 때 확인용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-data-${{ github.run_number }}
          path: terminal_data.json
          retention-days: 14
