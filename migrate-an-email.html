<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>AN 이메일 매핑 데이터 마이그레이션 (1회용)</title>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
  button { font-size: 16px; padding: 10px 20px; cursor: pointer; }
  #log { white-space: pre-wrap; background: #f5f5f5; padding: 12px; border-radius: 6px; margin-top: 16px; font-size: 13px; max-height: 400px; overflow-y: auto; }
  .warn { color: #b45309; font-weight: bold; }
</style>
</head>
<body>
  <h2>⚠️ AN 이메일 매핑 데이터 1회용 마이그레이션</h2>
  <p>기존 구글시트(Apps Script)에 있는 NOTIFY 코드 ↔ AN EMAIL 매핑을 (모든 라인 한 번에) Firestore로 옮겨요.</p>
  <p class="warn">이 버튼은 딱 한 번만 눌러주세요. 두 번 누르면 데이터가 중복으로 쌓여요.</p>
  <button id="startBtn">마이그레이션 시작</button>
  <div id="log"></div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-check-compat.js"></script>
  <script src="firebase-init.js"></script>
  <script>
    const OLD_AN_EMAIL_SHEET_API_URL = "https://script.google.com/macros/s/AKfycbzfmlWLBJVi3vUJxsCk7s_vnwu7t5TJQbJUSXBZyZ0KWbqYjKqrzHWvmYKWtqD_lkgX/exec";
    const logEl = document.getElementById("log");
    function log(msg) {
      logEl.textContent += msg + "\n";
      logEl.scrollTop = logEl.scrollHeight;
    }

    function anEmailDocId(line, code) {
      const safeLine = String(line || "").trim().toUpperCase().replace(/[^A-Z0-9]/g, "_") || "LINE";
      const safeCode = String(code || "").trim().replace(/[\/\\\s#]/g, "_") || "CODE";
      return safeLine + "__" + safeCode;
    }

    document.getElementById("startBtn").addEventListener("click", async () => {
      document.getElementById("startBtn").disabled = true;
      try {
        log("Firebase 로그인 대기 중...");
        await window.fbReady;

        log("Firestore에 이미 데이터가 있는지 확인 중...");
        const existingSnap = await window.fbDb.collection("an_email_map").limit(1).get();
        if (!existingSnap.empty) {
          log("⚠️ 이미 an_email_map 컬렉션에 데이터가 있어요. 중복 방지를 위해 중단할게요.");
          log("(진짜로 다시 옮기고 싶으면, Firebase 콘솔에서 an_email_map 컬렉션을 먼저 비워주세요.)");
          return;
        }

        log("기존 구글시트에서 전체 매핑 불러오는 중... (line 파라미터 없이 호출하면 전체 라인이 다 와요)");
        const res = await fetch(OLD_AN_EMAIL_SHEET_API_URL, { method: "GET" });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "목록을 불러오지 못했어요.");

        log(`총 ${data.list.length}건 불러옴. Firestore에 저장 시작...`);

        let batch = window.fbDb.batch();
        let count = 0;
        for (const row of data.list) {
          const docRef = window.fbDb.collection("an_email_map").doc(anEmailDocId(row.line, row.code));
          batch.set(docRef, {
            line: (row.line || "").toUpperCase(),
            code: row.code || "",
            email: row.email || "",
            month: row.month || "",
            day: row.day || "",
            source: row.source || "",
            updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
          });
          count++;
          if (count % 400 === 0) {
            await batch.commit();
            log(`${count}건 저장 완료...`);
            batch = window.fbDb.batch();
          }
        }
        await batch.commit();
        log(`✅ 완료! 총 ${count}건이 Firestore로 이전됐어요.`);
        log("이제 이 파일(migrate-an-email.html)은 삭제하셔도 돼요.");
      } catch (err) {
        log("❌ 오류 발생: " + err);
      }
    });
  </script>
</body>
</html>
